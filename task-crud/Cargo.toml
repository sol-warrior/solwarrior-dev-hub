[package]
name = "task-crud"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.12.1"
chrono ={ version = "0.4.42", features=["serde"]}
serde = { version = "1.0.228", features = ["derive"] }

thiserror = "2.0.17"
tokio = {version = "1.48.0", features = ["rt-multi-thread", "macros","sync"]}
uuid = {version = "1.19.0", features=["serde", "v4"]}